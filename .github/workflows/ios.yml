name: iOS

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -switch /Applications/Xcode_16.4.app/Contents/Developer || sudo xcode-select -switch /Applications/Xcode.app/Contents/Developer
      - name: Show Xcode version
        run: xcodebuild -version
      - name: Build unsigned app and package IPA
        run: |
          set -euo pipefail
          SCHEME=$(xcodebuild -list -json 2>/dev/null | python3 -c "import sys,json; d=json.load(sys.stdin); s=(d.get('workspace') or {}).get('schemes') or (d.get('project') or {}).get('schemes') or []; print(next((x for x in s if x!='Package'), s[0] if s else 'nauxApp'))")
          echo "Using scheme: $SCHEME"
          xcodebuild -scheme "$SCHEME" -destination 'generic/platform=iOS' -configuration Release -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build

          BIN_PATH=$(find build/Build/Products -type f -name "$SCHEME" -perm -111 | head -n 1 || true)
          if [ -z "$BIN_PATH" ]; then
            BIN_PATH=$(find build/Build/Products -type f -name 'nauxApp' -perm -111 | head -n 1 || true)
          fi
          if [ -z "$BIN_PATH" ]; then
            echo "No executable produced" >&2
            find build/Build/Products -maxdepth 3 -print || true
            exit 1
          fi
          echo "Found executable: $BIN_PATH"

          APP_NAME="naux"
          APP_DIR="Payload/${APP_NAME}.app"
          mkdir -p "$APP_DIR"

          cp "$BIN_PATH" "$APP_DIR/$APP_NAME"
          chmod +x "$APP_DIR/$APP_NAME"

          cat > "$APP_DIR/Info.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleDevelopmentRegion</key>
            <string>en</string>
            <key>CFBundleExecutable</key>
            <string>naux</string>
            <key>CFBundleIdentifier</key>
            <string>com.buendiabenedict.app</string>
            <key>CFBundleInfoDictionaryVersion</key>
            <string>6.0</string>
            <key>CFBundleName</key>
            <string>naux</string>
            <key>CFBundlePackageType</key>
            <string>APPL</string>
            <key>CFBundleShortVersionString</key>
            <string>1.0</string>
            <key>CFBundleVersion</key>
            <string>1</string>
            <key>LSRequiresIPhoneOS</key>
            <true/>
            <key>UIBackgroundModes</key>
            <array>
              <string>audio</string>
            </array>
            <key>MinimumOSVersion</key>
            <string>16.0</string>
            <key>UIDeviceFamily</key>
            <array>
              <integer>1</integer>
              <integer>2</integer>
            </array>
            <key>UILaunchScreen</key>
            <dict/>
            <key>UISupportedInterfaceOrientations</key>
            <array>
              <string>UIInterfaceOrientationPortrait</string>
              <string>UIInterfaceOrientationLandscapeLeft</string>
              <string>UIInterfaceOrientationLandscapeRight</string>
            </array>
            <key>CFBundleIcons</key>
            <dict>
              <key>CFBundlePrimaryIcon</key>
              <dict>
                <key>CFBundleIconFiles</key>
                <array>
                  <string>AppIcon60x60</string>
                </array>
              </dict>
            </dict>
          </dict>
          </plist>
          PLIST

          cp "Assets/AppIcon.jpg" "$APP_DIR/AppIcon60x60@2x.png"
          cp "Assets/AppIcon.jpg" "$APP_DIR/AppIcon60x60@3x.png"
          sips -z 120 120 "$APP_DIR/AppIcon60x60@2x.png" >/dev/null
          sips -z 180 180 "$APP_DIR/AppIcon60x60@3x.png" >/dev/null
          sips -s format png "$APP_DIR/AppIcon60x60@2x.png" --out "$APP_DIR/AppIcon60x60@2x.png" >/dev/null
          sips -s format png "$APP_DIR/AppIcon60x60@3x.png" --out "$APP_DIR/AppIcon60x60@3x.png" >/dev/null

          echo "APPL????" > "$APP_DIR/PkgInfo"
          rm -f naux-unsigned.ipa
          (cd "$(pwd)" && zip -qry naux-unsigned.ipa Payload)
          unzip -l naux-unsigned.ipa | head -n 20
      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: naux-unsigned-ipa
          path: naux-unsigned.ipa
