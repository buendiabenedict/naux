name: iOS

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -switch /Applications/Xcode_16.4.app/Contents/Developer || sudo xcode-select -switch /Applications/Xcode.app/Contents/Developer
      - name: Show Xcode version
        run: xcodebuild -version
      - name: Build unsigned app and package IPA
        run: |
          set -euo pipefail
          SCHEME=$(xcodebuild -list -json 2>/dev/null | python3 -c "import sys,json; d=json.load(sys.stdin); s=(d.get('workspace') or {}).get('schemes') or (d.get('project') or {}).get('schemes') or []; print(next((x for x in s if x!='Package'), s[0] if s else 'nauxApp'))")
          echo "Using scheme: $SCHEME"
          xcodebuild -scheme "$SCHEME" -destination 'generic/platform=iOS' -configuration Release -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build

          BIN_PATH=$(find build/Build/Products -type f -name "$SCHEME" -perm -111 | head -n 1 || true)
          if [ -z "$BIN_PATH" ]; then
            BIN_PATH=$(find build/Build/Products -type f -name 'nauxApp' -perm -111 | head -n 1 || true)
          fi
          if [ -z "$BIN_PATH" ]; then
            echo "No executable produced" >&2
            find build/Build/Products -maxdepth 3 -print || true
            exit 1
          fi
          echo "Found executable: $BIN_PATH"

          APP_NAME="naux"
          APP_DIR="Payload/${APP_NAME}.app"
          mkdir -p "$APP_DIR"

          cp "$BIN_PATH" "$APP_DIR/$APP_NAME"
          chmod +x "$APP_DIR/$APP_NAME"

          cat > "$APP_DIR/Info.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleDevelopmentRegion</key>
            <string>en</string>
            <key>CFBundleExecutable</key>
            <string>naux</string>
            <key>CFBundleIdentifier</key>
            <string>com.buendiabenedict.app</string>
            <key>CFBundleInfoDictionaryVersion</key>
            <string>6.0</string>
            <key>CFBundleName</key>
            <string>naux</string>
            <key>CFBundlePackageType</key>
            <string>APPL</string>
            <key>CFBundleShortVersionString</key>
            <string>1.0</string>
            <key>CFBundleVersion</key>
            <string>1</string>
            <key>LSRequiresIPhoneOS</key>
            <true/>
            <key>UIBackgroundModes</key>
            <array>
              <string>audio</string>
            </array>
            <key>MinimumOSVersion</key>
            <string>16.0</string>
            <key>UIDeviceFamily</key>
            <array>
              <integer>1</integer>
              <integer>2</integer>
            </array>
            <key>UILaunchScreen</key>
            <dict/>
            <key>UISupportedInterfaceOrientations</key>
            <array>
              <string>UIInterfaceOrientationPortrait</string>
              <string>UIInterfaceOrientationLandscapeLeft</string>
              <string>UIInterfaceOrientationLandscapeRight</string>
            </array>
            <key>CFBundleIcons</key>
            <dict>
              <key>CFBundlePrimaryIcon</key>
              <dict>
                <key>CFBundleIconFiles</key>
                <array>
                  <string>AppIcon60x60</string>
                </array>
              </dict>
            </dict>
          </dict>
          </plist>
          PLIST

          python3 - <<'PY'
          import struct, zlib
          w=h=120
          def chunk(t,d): return struct.pack('>I',len(d))+t+d+struct.pack('>I',zlib.crc32(t+d)&0xffffffff)
          def px(x,y):
            cx=cy=60
            dx=x-cx; dy=y-cy
            d2=dx*dx+dy*dy
            if d2>55*55: return (0,0,0,0)
            r=max(0,255-int(d2*0.03))
            g=max(0,180-int(d2*0.02))
            b=255
            # simple note
            in_note=False
            if 48<=x<=52 and 35<=y<=75: in_note=True
            if 62<=x<=66 and 30<=y<=70: in_note=True
            if 48<=x<=66 and 30<=y<=36: in_note=True
            if 62<=x<=70 and 66<=y<=76: in_note=True
            if (x-46)**2 + (y-75)**2 <= 7*7: in_note=True
            if (x-60)**2 + (y-70)**2 <= 7*7: in_note=True
            if in_note: return (255,255,255,255)
            return (r,g,b,255)
          raw=b''
          for y in range(h):
            raw+=b'\x00'
            for x in range(w): raw+=bytes(px(x,y))
          with open("Payload/naux.app/AppIcon60x60@2x.png",'wb') as f:
            f.write(b'\x89PNG\r\n\x1a\n')
            f.write(chunk(b'IHDR', struct.pack('>IIBBBBB',w,h,8,6,0,0,0)))
            f.write(chunk(b'IDAT', zlib.compress(raw,9)))
            f.write(chunk(b'IEND', b''))
          PY

          echo "APPL????" > "$APP_DIR/PkgInfo"
          rm -f naux-unsigned.ipa
          (cd "$(pwd)" && zip -qry naux-unsigned.ipa Payload)
          unzip -l naux-unsigned.ipa | head -n 20
      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: naux-unsigned-ipa
          path: naux-unsigned.ipa
